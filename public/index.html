<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mongo Change Tracker</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#12161d;
    --panel-2:#171c25;
    --border:#232a35;
    --text:#e6e9ef;
    --text-dim:#8b94a3;
    --accent:#59d9b3;
    --insert:#59d9b3;
    --update:#e8b654;
    --replace:#6ea8ff;
    --delete:#f2707a;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{ box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#3a4656 transparent; }
  *::-webkit-scrollbar{ width:9px; height:9px; }
  *::-webkit-scrollbar-track{ background:transparent; }
  *::-webkit-scrollbar-thumb{ background:#303b4a; border:2px solid transparent; border-radius:999px; background-clip:padding-box; }
  *::-webkit-scrollbar-thumb:hover{ background:#59d9b3; border-color:transparent; background-clip:padding-box; }
  *::-webkit-scrollbar-corner{ background:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:12px; padding:14px 20px;
    border-bottom:1px solid var(--border); background:var(--panel);
    flex-shrink:0;
  }
  header h1{ font-size:15px; font-weight:600; margin:0; letter-spacing:0.2px; }
  header .sub{ font-size:12px; color:var(--text-dim); font-family:var(--mono); }
  .pulse-wrap{ display:flex; align-items:center; gap:6px; margin-left:auto; font-size:12px; color:var(--text-dim); font-family:var(--mono); }
  .pulse{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 0 rgba(89,217,179,0.6); animation:pulse 1.8s infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(89,217,179,0.55); }
    70%{ box-shadow:0 0 0 8px rgba(89,217,179,0); }
    100%{ box-shadow:0 0 0 0 rgba(89,217,179,0); }
  }
  .pulse.off{ background:var(--delete); animation:none; }

  input, select, button{
    font-family:var(--sans); font-size:12.5px; background:var(--panel-2); color:var(--text);
    border:1px solid var(--border); border-radius:6px; padding:7px 10px; cursor:pointer;
  }
  input{ cursor:text; }
  main{ flex:1; display:flex; min-height:0; }
  .col{ overflow-y:auto; border-right:1px solid var(--border); }
  .col:last-child{ border-right:none; }
  #documents-col{ width:300px; flex-shrink:0; }
  #timeline-col{ width:340px; flex-shrink:0; }
  #detail-col{ flex:1; min-width:0; }

  .col-header{
    position:sticky; top:0; background:var(--panel); padding:10px 14px;
    font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-dim);
    border-bottom:1px solid var(--border); z-index:1;
  }
  .group-label{ padding:10px 14px 4px; font-size:11px; color:var(--text-dim); font-family:var(--mono); }

  .doc-item, .event-item{
    padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--border);
    transition:background .12s ease;
  }
  .doc-item:hover, .event-item:hover{ background:var(--panel-2); }
  .doc-item.active, .event-item.active{ background:var(--panel-2); box-shadow:inset 3px 0 0 var(--accent); }

  .doc-id{ font-family:var(--mono); font-size:12.5px; color:var(--text); }
  .doc-subject{ font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .doc-subject + .doc-id{ margin-top:3px; color:var(--text-dim); font-size:11px; }
  .doc-meta{ margin-top:4px; display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); }
  .badge{
    font-family:var(--mono); font-size:10px; padding:2px 6px; border-radius:4px;
    text-transform:uppercase; letter-spacing:0.4px; font-weight:600;
  }
  .badge.insert{ background:rgba(89,217,179,0.15); color:var(--insert); }
  .badge.update{ background:rgba(232,182,84,0.15); color:var(--update); }
  .badge.replace{ background:rgba(110,168,255,0.15); color:var(--replace); }
  .badge.delete{ background:rgba(242,112,122,0.15); color:var(--delete); }
  .method-tag{ font-family:var(--mono); color:var(--text-dim); }

  .empty{ padding:24px 16px; color:var(--text-dim); font-size:13px; line-height:1.6; }

  #detail-col{ padding:20px 24px; }
  .detail-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .detail-head h2{ font-size:16px; margin:0; font-family:var(--mono); font-weight:600; }
  .detail-time{ font-size:12px; color:var(--text-dim); margin-bottom:18px; font-family:var(--mono); }

  .field-table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12.5px; margin-bottom:24px; }
  .field-table th{ text-align:left; padding:6px 10px; color:var(--text-dim); font-weight:500; border-bottom:1px solid var(--border); font-size:11px; text-transform:uppercase; letter-spacing:0.4px; }
  .field-table td{ padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  .field-name{ color:var(--accent); white-space:nowrap; }
  .val-before{ color:var(--delete); text-decoration:line-through; opacity:0.75; }
  .val-after{ color:var(--insert); }

  .section-title{ font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-dim); margin:0 0 10px; }

  .template-box{ background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .template-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  button{ background:var(--accent); color:#06231b; font-weight:600; border:none; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  button.secondary{ background:var(--panel-2); color:var(--text); border:1px solid var(--border); }

  .toggle-label{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); cursor:pointer; }

  .validate-result{ margin-top:14px; font-family:var(--mono); font-size:12.5px; }
  .validate-result.valid{ color:var(--insert); }
  .validate-result.invalid{ color:var(--delete); }
  .err-list{ margin:8px 0 0; padding-left:18px; color:var(--text-dim); }
  .err-list li{ margin-bottom:4px; }
  .err-list code{ color:var(--update); }

  .session-box{ background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:18px; }
  .session-event{ padding:10px 0; border-bottom:1px solid var(--border); }
  .session-event:last-child{ border-bottom:none; }
  .muted{ color:var(--text-dim); }

  pre.raw{ background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; font-family:var(--mono); font-size:12px; overflow-x:auto; color:var(--text-dim); }
  .raw-line{ display:block; min-width:max-content; padding:1px 8px; margin:0 -8px; }
  .raw-line.changed{ cursor:pointer; }
  .raw-line-number{ display:inline-block; width:42px; margin-right:12px; color:#566273; text-align:right; user-select:none; }
  .raw-line.changed{ color:#b8f5d9; background:rgba(89,217,179,0.14); border-left:3px solid var(--accent); padding-left:5px; }
  .raw-line.compare-changed{ color:#ffe7a3; background:rgba(232,182,84,0.18); border-left:3px solid var(--update); padding-left:5px; }
  .raw-line.focus-line{ color:#d7e7ff !important; background:rgba(110,168,255,.17) !important; border-left:1px solid rgba(110,168,255,.9) !important; border-right:1px solid rgba(110,168,255,.9); padding-left:7px; }
  .raw-line.focus-start{ border-top:1px solid var(--replace); border-top-left-radius:3px; border-top-right-radius:3px; }
  .raw-line.focus-end{ border-bottom:1px solid var(--replace); border-bottom-left-radius:3px; border-bottom-right-radius:3px; }
  .change-nav{ display:flex; align-items:center; gap:6px; margin:0 0 7px; color:var(--text-dim); font-family:var(--mono); font-size:11px; }
  .change-nav .change-label{ margin-right:auto; text-transform:uppercase; letter-spacing:.5px; }
  .change-nav .change-count{ color:var(--text); min-width:42px; text-align:right; }
  .change-nav button{ width:25px; height:23px; padding:0; background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border); border-radius:4px; font-size:14px; line-height:1; }
  .change-nav button:hover:not(:disabled){ color:var(--accent); border-color:var(--accent); }
  .change-nav button:disabled{ opacity:.35; cursor:not-allowed; }
  .change-nav.floating{ position:fixed; top:64%; right:18px; z-index:15; transform:translateY(-50%); margin:0; padding:8px 8px 8px 11px; background:rgba(18,22,29,.94); border:1px solid #354252; border-radius:11px; box-shadow:0 14px 34px rgba(0,0,0,.45), 0 0 0 1px rgba(110,168,255,.05); backdrop-filter:blur(10px); }
  .compare-panel{ padding:20px 24px; }
  .compare-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .compare-head h2{ margin:0; font-size:16px; font-family:var(--mono); }
  .compare-note{ color:var(--text-dim); font-size:12px; }
  .compare-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; min-width:0; }
  .compare-pane{ min-width:0; position:relative; }
  .compare-pane-title{ display:flex; align-items:center; gap:8px; margin-bottom:8px; color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
  .compare-pane-title strong{ color:var(--text); font-family:var(--mono); font-size:12px; text-transform:none; letter-spacing:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .compare-pane-time{ color:var(--text-dim); font-family:var(--mono); font-size:10px; white-space:nowrap; letter-spacing:0; text-transform:none; }
  .compare-pane .change-nav{ margin-top:12px; }
  .compare-drop{ min-height:260px; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--text-dim); border:1px dashed var(--border); border-radius:8px; background:var(--panel); padding:20px; font-size:12px; }
  .compare-drop.drag-over{ border-color:var(--update); background:rgba(232,182,84,0.08); color:#ffe7a3; }
  .compare-grid pre.raw{ max-height:calc(100vh - 180px); overflow:auto; }
  .event-item[draggable="true"]{ cursor:grab; }
  .event-item.dragging{ opacity:.5; }
  .event-context-menu{ position:fixed; z-index:20; min-width:220px; padding:6px; background:rgba(23,28,37,.96); border:1px solid #354252; border-radius:9px; box-shadow:0 16px 38px rgba(0,0,0,.48), 0 0 0 1px rgba(89,217,179,.04); backdrop-filter:blur(10px); animation:menu-in .12s ease-out; }
  @keyframes menu-in{ from{ opacity:0; transform:translateY(-4px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .event-context-menu button{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:transparent; color:var(--text); padding:9px 10px; border-radius:6px; font-weight:500; }
  .event-context-menu button:hover{ background:#26313d; color:var(--accent); }
  .event-context-menu button:last-child:hover{ color:var(--update); }
  .menu-icon{ width:18px; color:var(--text-dim); font-family:var(--mono); font-size:13px; text-align:center; }
  .rename-overlay{ position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(5,8,12,.78); backdrop-filter:blur(5px); }
  .rename-dialog{ width:min(420px,100%); background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:0 18px 60px rgba(0,0,0,.55); overflow:hidden; }
  .rename-dialog::before{ content:""; display:block; height:3px; background:linear-gradient(90deg,var(--accent),var(--update)); }
  .rename-body{ padding:20px; }
  .rename-eyebrow{ margin-bottom:8px; color:var(--accent); font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.8px; }
  .rename-dialog h2{ margin:0; font-size:17px; font-weight:600; }
  .rename-description{ margin:7px 0 16px; color:var(--text-dim); font-size:12px; line-height:1.5; }
  .rename-input{ width:100%; padding:10px 11px; border-color:#354252; background:#0d1219; font-family:var(--mono); }
  .rename-input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(89,217,179,.12); }
  .rename-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .rename-actions button{ min-width:88px; }
  .back-to-top{ position:fixed; right:18px; bottom:18px; z-index:16; display:flex; align-items:center; gap:7px; padding:8px 11px; background:rgba(18,22,29,.94); color:var(--text); border:1px solid #354252; border-radius:8px; box-shadow:0 10px 26px rgba(0,0,0,.4); backdrop-filter:blur(9px); font-family:var(--mono); font-size:11px; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .16s ease, transform .16s ease, border-color .16s ease; }
  .back-to-top.visible{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .back-to-top:hover{ color:var(--accent); border-color:var(--accent); }

  @media (max-width: 900px){
    main{ flex-direction:column; overflow-y:auto; }
    .col{ width:100% !important; border-right:none; border-bottom:1px solid var(--border); max-height:280px; }
    #detail-col{ max-height:none; }
  }
</style>
</head>
<body>

<header>
  <h1>Mongo Change Tracker</h1>
  <span class="sub">real-time change stream inspector</span>
  <div class="pulse-wrap"><span class="pulse" id="pulse"></span><span id="pulse-label">connecting…</span></div>
</header>

<main>
  <section class="col" id="documents-col">
    <div class="col-header">Documents</div>
    <div id="documents-list"><div class="empty">กำลังโหลด…</div></div>
  </section>

  <section class="col" id="timeline-col">
    <div class="col-header">Event timeline</div>
    <div id="timeline-list"><div class="empty">เลือก document ทางซ้ายเพื่อดู timeline ของการเปลี่ยนแปลง</div></div>
  </section>

  <section class="col" id="detail-col">
    <div class="empty">เลือก event เพื่อดูรายละเอียด: ชื่อ method ที่เรียก, field ที่เปลี่ยน และเทียบกับ template ได้</div>
  </section>
</main>
<button type="button" class="back-to-top" id="back-to-top-btn" title="Back to top">↑ <span>Top</span></button>

<script>
const state = {
  collection:null,
  documentId:null,
  eventId:null,
  timelineEvents:new Map(),
  compare:{ current:null, incoming:null },
};

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('th-TH', { hour12:false });
}
function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function opBadge(op){ return `<span class="badge ${escapeHtml(op)}">${escapeHtml(op)}</span>`; }
function eventLabel(event){
  if (event?.displayName) return event.displayName;
  if (event?.operationType === 'insert') return 'Document created';
  if (event?.operationType === 'delete') return 'Document deleted';
  if (event?.operationType === 'update' || event?.operationType === 'replace') return 'Document changed';
  return 'Document event';
}
function jsonPreview(v){
  if (v === null || v === undefined) return 'null';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}
function isChangedPath(path, changedPaths){
  if (!path) return false;
  return changedPaths.some(changed => path === changed || path.startsWith(`${changed}.`) || changed.startsWith(`${path}.`));
}
function rawLine(text, changed, className='changed', lineState){
  const lineNumber = lineState ? ++lineState.value : '';
  return `<span class="raw-line${changed ? ` ${className}` : ''}"><span class="raw-line-number">${lineNumber}</span>${escapeHtml(text)}</span>`;
}
function addTrailingComma(line){
  return line.replace(/<\/span>$/, ',</span>');
}
function renderJsonLines(value, path, level, prefix, changedPaths, highlightClass='changed', lineState={ value:0 }){
  const indent = '  '.repeat(level);
  const changed = changedPaths.includes(path);

  if (Array.isArray(value)){
    if (!value.length) return [rawLine(`${indent}${prefix}[]`, changed, highlightClass, lineState)];
    const lines = [rawLine(`${indent}${prefix}[`, changed, highlightClass, lineState)];
    value.forEach((item, index) => {
      const childLines = renderJsonLines(item, `${path}.${index}`, level + 1, '', changedPaths, highlightClass, lineState);
      const last = childLines.length - 1;
      if (index < value.length - 1) childLines[last] = addTrailingComma(childLines[last]);
      lines.push(...childLines);
    });
    lines.push(rawLine(`${indent}]`, changed, highlightClass, lineState));
    return lines;
  }

  if (value && typeof value === 'object'){
    const entries = Object.entries(value);
    if (!entries.length) return [rawLine(`${indent}${prefix}{}`, changed, highlightClass, lineState)];
    const lines = [rawLine(`${indent}${prefix}{`, changed, highlightClass, lineState)];
    entries.forEach(([key, item], index) => {
      const childPath = path ? `${path}.${key}` : key;
      const childLines = renderJsonLines(item, childPath, level + 1, `${JSON.stringify(key)}: `, changedPaths, highlightClass, lineState);
      const last = childLines.length - 1;
      if (index < entries.length - 1) childLines[last] = addTrailingComma(childLines[last]);
      lines.push(...childLines);
    });
    lines.push(rawLine(`${indent}}`, changed, highlightClass, lineState));
    return lines;
  }

  return [rawLine(`${indent}${prefix}${JSON.stringify(value)}`, changed, highlightClass, lineState)];
}
function renderRawDocument(event){
  if (!event.after) return '(document was deleted)';
  const changedPaths = (event.changedFields || []).map(field => field.field);
  return renderJsonLines(event.after, '', 0, '', changedPaths).join('');
}
function stableValue(value){
  try { return JSON.stringify(value); } catch { return String(value); }
}
function collectLeafValues(value, path, result){
  if (Array.isArray(value)){
    if (!value.length){ result.set(path, stableValue(value)); return; }
    value.forEach((item, index) => collectLeafValues(item, path ? `${path}.${index}` : String(index), result));
    return;
  }
  if (value && typeof value === 'object'){
    const entries = Object.entries(value);
    if (!entries.length){ result.set(path, stableValue(value)); return; }
    entries.forEach(([key, item]) => collectLeafValues(item, path ? `${path}.${key}` : key, result));
    return;
  }
  if (path) result.set(path, stableValue(value));
}
function hasDocumentPath(document, path){
  if (!path) return true;
  let value = document;
  for (const segment of path.split('.')){
    if (value === null || value === undefined || !Object.prototype.hasOwnProperty.call(Object(value), segment)) return false;
    value = value[segment];
  }
  return true;
}
function markerPathsForDocument(paths, document){
  const markers = [];
  for (const path of paths){
    if (hasDocumentPath(document, path)){ markers.push(path); continue; }
    const parts = path.split('.');
    while (parts.length > 1){
      parts.pop();
      const parent = parts.join('.');
      if (hasDocumentPath(document, parent)){ markers.push(parent); break; }
    }
  }
  return [...new Set(markers)];
}
function overlappingDiffPaths(left, right){
  const currentValues = new Map();
  const incomingValues = new Map();
  collectLeafValues(left, '', currentValues);
  collectLeafValues(right, '', incomingValues);
  const paths = new Set([...currentValues.keys(), ...incomingValues.keys()]);
  return [...paths].filter(path => currentValues.get(path) !== incomingValues.get(path));
}
function renderCompareDocument(event, changedPaths){
  if (!event?.after) return '(document was deleted)';
  return renderJsonLines(event.after, '', 0, '', changedPaths, 'compare-changed').join('');
}
function setupChangeNavigator(navId, preId, markerClass){
  const nav = document.getElementById(navId);
  const pre = document.getElementById(preId);
  if (!nav || !pre) return;
  nav.classList.add('floating');
  document.body.appendChild(nav);
  const lines = [...pre.querySelectorAll(`.raw-line.${markerClass}`)];
  const groups = [];
  lines.forEach(line => {
    const lineIndex = [...pre.children].indexOf(line);
    const lastGroup = groups[groups.length - 1];
    if (lastGroup && lineIndex === lastGroup.end + 1) {
      lastGroup.lines.push(line);
      lastGroup.end = lineIndex;
    } else {
      groups.push({ lines:[line], end:lineIndex });
    }
  });
  let active = -1;
  const count = nav.querySelector('.change-count');
  const previous = nav.querySelector('[data-direction="previous"]');
  const next = nav.querySelector('[data-direction="next"]');
  const update = (shouldScroll = false) => {
    count.textContent = active >= 0 ? `${active + 1} / ${groups.length}` : `0 / ${groups.length}`;
    previous.disabled = groups.length === 0;
    next.disabled = groups.length === 0;
    groups.forEach(group => group.lines.forEach(line => line.classList.remove('focus-line', 'focus-start', 'focus-end')));
    if (groups[active]) {
      groups[active].lines.forEach(line => line.classList.add('focus-line'));
      groups[active].lines[0].classList.add('focus-start');
      groups[active].lines[groups[active].lines.length - 1].classList.add('focus-end');
      if (shouldScroll) focusChangeLine(pre, groups[active].lines[0]);
    }
  };
  groups.forEach((group, groupIndex) => {
    group.lines.forEach(line => {
      line.addEventListener('click', () => {
        active = groupIndex;
        update(false);
      });
    });
  });
  previous.addEventListener('click', () => { active = active <= 0 ? groups.length - 1 : active - 1; update(true); });
  next.addEventListener('click', () => { active = active < 0 ? 0 : (active + 1) % groups.length; update(true); });
  update(false);
}
function removeFloatingChangeNavigators(){
  document.querySelectorAll('.change-nav.floating').forEach(nav => nav.remove());
}
function focusChangeLine(pre, line){
  if (!pre || !line) return;
  if (pre.scrollHeight > pre.clientHeight) {
    const preRect = pre.getBoundingClientRect();
    const lineRect = line.getBoundingClientRect();
    pre.scrollTo({ top: pre.scrollTop + lineRect.top - preRect.top - (pre.clientHeight / 2) + (line.clientHeight / 2), behavior:'auto' });
    return;
  }
  const container = pre.closest('.col') || document.scrollingElement;
  const containerRect = container.getBoundingClientRect ? container.getBoundingClientRect() : { top:0 };
  const lineRect = line.getBoundingClientRect();
  const viewportHeight = container.clientHeight || window.innerHeight;
  container.scrollTo({ top: container.scrollTop + lineRect.top - containerRect.top - (viewportHeight / 2) + (line.clientHeight / 2), behavior:'auto' });
}

async function loadDocuments(){
  const res = await fetch('/api/documents');
  const docs = await res.json();
  const list = document.getElementById('documents-list');
  if (!docs.length){ list.innerHTML = '<div class="empty">ยังไม่มีการเปลี่ยนแปลงที่ตรง filter ลองเรียก action จาก frontend หรือปรับ filter ดู</div>'; return; }

  const groups = {};
  for (const d of docs){ (groups[d.collection] ??= []).push(d); }

  list.innerHTML = Object.entries(groups).map(([coll, items]) => `
    <div class="group-label">${escapeHtml(coll)}</div>
    ${items.map(d => `
      <div class="doc-item ${state.collection===coll && state.documentId===d.documentId ? 'active':''}"
           data-collection="${escapeHtml(coll)}" data-id="${escapeHtml(d.documentId)}">
        <div class="doc-subject" title="${escapeHtml(d.subject || '')}">${escapeHtml(d.subject || 'Untitled document')}</div>
        <div class="doc-id" title="${escapeHtml(d.documentId)}">${escapeHtml(d.documentId)}</div>
        <div class="doc-meta">
          ${opBadge(d.lastOperationType)}
          <span class="method-tag">${escapeHtml(eventLabel({ operationType:d.lastOperationType }))}</span>
          <span>· ${d.eventCount} event${d.eventCount>1?'s':''}</span>
        </div>
      </div>
    `).join('')}
  `).join('');

  list.querySelectorAll('.doc-item').forEach(el => {
    el.addEventListener('click', () => selectDocument(el.dataset.collection, el.dataset.id));
  });
}

async function selectDocument(collection, documentId){
  state.collection = collection; state.documentId = documentId; state.eventId = null;
  removeFloatingChangeNavigators();
  await loadDocuments();
  const res = await fetch(`/api/documents/${encodeURIComponent(collection)}/${encodeURIComponent(documentId)}/events`);
  const events = await res.json();
  state.timelineEvents = new Map(events.map(event => [String(event._id), event]));
  state.compare = { current:null, incoming:null };
  const list = document.getElementById('timeline-list');
  list.innerHTML = events.map(e => `
    <div class="event-item" draggable="true" data-id="${escapeHtml(e._id)}">
      <div class="doc-meta" style="margin-top:0">
        ${opBadge(e.operationType)}
        <span class="method-tag">${escapeHtml(eventLabel(e))}</span>
      </div>
      <div class="doc-id" style="margin-top:4px; font-size:11.5px; color:var(--text-dim)">${fmtTime(e.timestamp)}</div>
      <div style="margin-top:4px; font-size:11.5px; color:var(--text-dim)">${e.changedFields.length} field${e.changedFields.length!==1?'s':''} changed</div>
    </div>
  `).join('') || '<div class="empty">ไม่มี event</div>';

  list.querySelectorAll('.event-item').forEach(el => {
    el.addEventListener('click', () => selectEvent(el.dataset.id));
    el.addEventListener('dragstart', event => {
      event.dataTransfer.setData('text/event-id', el.dataset.id);
      event.dataTransfer.effectAllowed = 'copy';
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('contextmenu', event => {
      event.preventDefault();
      event.stopPropagation();
      showEventContextMenu(el.dataset.id, event.clientX, event.clientY);
    });
  });
}

function closeEventContextMenu(){
  document.querySelector('.event-context-menu')?.remove();
}
document.addEventListener('pointerdown', event => {
  if (!event.target.closest('.event-context-menu')) closeEventContextMenu();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeEventContextMenu();
});
document.addEventListener('contextmenu', event => {
  if (!event.target.closest('.event-context-menu')) closeEventContextMenu();
});
function showEventContextMenu(eventId, x, y){
  closeEventContextMenu();
  const menu = document.createElement('div');
  menu.className = 'event-context-menu';
  menu.innerHTML = '<button type="button" data-action="compare"><span class="menu-icon">⇄</span><span>Compare event from here</span></button><button type="button" data-action="rename"><span class="menu-icon">✎</span><span>Rename event</span></button>';
  menu.style.left = `${Math.min(x, window.innerWidth - 190)}px`;
  menu.style.top = `${Math.min(y, window.innerHeight - 50)}px`;
  menu.querySelector('[data-action="compare"]').addEventListener('click', () => {
    closeEventContextMenu();
    beginEventCompare(eventId);
  });
  menu.querySelector('[data-action="rename"]').addEventListener('click', () => {
    closeEventContextMenu();
    renameEvent(eventId);
  });
  document.body.appendChild(menu);
}
function requestEventName(currentName){
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'rename-overlay';
    overlay.innerHTML = `
      <div class="rename-dialog" role="dialog" aria-modal="true" aria-labelledby="rename-title">
        <div class="rename-body">
          <div class="rename-eyebrow">Event label</div>
          <h2 id="rename-title">Rename event</h2>
          <p class="rename-description">Give this timeline event a clear name for faster identification.</p>
          <input class="rename-input" type="text" maxlength="200" value="${escapeHtml(currentName)}" aria-label="Event name" />
          <div class="rename-actions">
            <button type="button" class="secondary" data-action="cancel">Cancel</button>
            <button type="button" data-action="save">Save event</button>
          </div>
        </div>
      </div>
    `;
    const input = overlay.querySelector('.rename-input');
    const finish = value => {
      overlay.remove();
      resolve(value);
    };
    overlay.querySelector('[data-action="cancel"]').addEventListener('click', () => finish(null));
    overlay.querySelector('[data-action="save"]').addEventListener('click', () => finish(input.value.trim()));
    overlay.addEventListener('click', event => {
      if (event.target === overlay) finish(null);
    });
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') finish(input.value.trim());
      if (event.key === 'Escape') finish(null);
    });
    document.body.appendChild(overlay);
    input.focus();
    input.select();
  });
}
async function renameEvent(eventId){
  const event = state.timelineEvents.get(String(eventId));
  if (!event) return;
  const currentName = event.displayName || event.methodName || '';
  const name = await requestEventName(currentName);
  if (name === null) return;
  const response = await fetch(`/api/events/${encodeURIComponent(eventId)}`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ name })
  });
  if (!response.ok) {
    const error = await response.json().catch(() => ({}));
    window.alert(error.error || 'Unable to rename event');
    return;
  }
  const updated = await response.json();
  state.timelineEvents.set(String(eventId), updated);
  await selectDocument(state.collection, state.documentId);
}
async function beginEventCompare(eventId){
  const event = state.timelineEvents.get(String(eventId));
  if (!event) return;
  state.compare = { current:event, incoming:null };
  renderComparePanel();
}
function renderComparePanel(){
  const current = state.compare.current;
  const incoming = state.compare.incoming;
  if (!current) return;
  removeFloatingChangeNavigators();
  const detail = document.getElementById('detail-col');
  const paths = incoming ? overlappingDiffPaths(current.after, incoming.after) : [];
  const currentPaths = incoming ? markerPathsForDocument(paths, current.after) : [];
  const incomingPaths = incoming ? markerPathsForDocument(paths, incoming.after) : [];
  const currentRaw = incoming
    ? renderCompareDocument(current, currentPaths)
    : renderRawDocument(current);
  const incomingContent = incoming
    ? `<pre class="raw" id="compare-incoming-raw">${renderCompareDocument(incoming, incomingPaths)}</pre>`
    : '<div class="compare-drop" id="incoming-drop">Drag another timeline event here to compare</div>';

  detail.innerHTML = `
    <div class="compare-panel">
      <div class="compare-head">
        <div>
          <h2>Compare events</h2>
          <div class="compare-note">Changed, added, and removed fields are highlighted in yellow.</div>
        </div>
        <button type="button" class="secondary" id="close-compare-btn">Close</button>
      </div>
      <div class="compare-grid">
        <div class="compare-pane">
          <div class="compare-pane-title"><span class="badge update">Current</span><strong>${escapeHtml(eventLabel(current))}</strong><span class="compare-pane-time">· ${escapeHtml(fmtTime(current.timestamp))}</span></div>
          <pre class="raw" id="compare-current-raw">${currentRaw}</pre>
        </div>
        <div class="compare-pane">
          <div class="compare-pane-title"><span class="badge insert">Incoming</span><strong>${escapeHtml(incoming ? eventLabel(incoming) : 'Drop an event')}</strong>${incoming ? `<span class="compare-pane-time">· ${escapeHtml(fmtTime(incoming.timestamp))}</span>` : ''}</div>
          ${incomingContent}
        </div>
      </div>
    </div>
  `;

  document.getElementById('close-compare-btn').addEventListener('click', () => {
    state.compare = { current:null, incoming:null };
    selectEvent(current._id);
  });
  const drop = document.getElementById('incoming-drop');
  if (drop){
    drop.addEventListener('dragover', event => {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
      drop.classList.add('drag-over');
    });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
    drop.addEventListener('drop', event => {
      event.preventDefault();
      drop.classList.remove('drag-over');
      const incomingId = event.dataTransfer.getData('text/event-id');
      const incomingEvent = state.timelineEvents.get(String(incomingId));
      if (!incomingEvent || String(incomingEvent._id) === String(current._id)) return;
      state.compare.incoming = incomingEvent;
      renderComparePanel();
    });
  }
}

async function selectEvent(eventId){
  state.eventId = eventId;
  removeFloatingChangeNavigators();
  document.querySelectorAll('.event-item').forEach(el => el.classList.toggle('active', el.dataset.id===eventId));

  const res = await fetch(`/api/events/${eventId}`);
  const ev = await res.json();
  const detail = document.getElementById('detail-col');

  const fieldsRows = ev.changedFields.map(f => `
    <tr>
      <td class="field-name">${escapeHtml(f.field)}</td>
      <td class="val-before">${escapeHtml(jsonPreview(f.before))}</td>
      <td class="val-after">${escapeHtml(jsonPreview(f.after))}</td>
    </tr>
  `).join('') || `<tr><td colspan="3" style="color:var(--text-dim)">ไม่มี field ที่เปลี่ยน</td></tr>`;

  detail.innerHTML = `
    <div class="detail-head">
      ${opBadge(ev.operationType)}
      <h2>${escapeHtml(eventLabel(ev))}</h2>
    </div>
    <div class="detail-time">${escapeHtml(ev.collection)} · ${escapeHtml(ev.documentId)} · ${fmtTime(ev.timestamp)}</div>
    <div class="detail-time">action source: ${escapeHtml(ev.action?.source || 'not mapped yet')}${ev.action?.logId ? ` · log ${escapeHtml(ev.action.logId)}` : ''}</div>

    <p class="section-title">Changed fields</p>
    <table class="field-table">
      <thead><tr><th>field</th><th>before</th><th>after</th></tr></thead>
      <tbody>${fieldsRows}</tbody>
    </table>

    <p class="section-title">Compare กับ template</p>
    <div class="template-box">
      <label class="toggle-label">
        <input type="checkbox" id="template-toggle" />
        เปิดเทียบข้อมูล (after) กับ JSON Schema template
      </label>
      <div id="template-controls" style="display:none; margin-top:12px;">
        <div class="template-row">
          <select id="template-select"><option value="">กำลังโหลด template…</option></select>
          <button id="validate-btn">Validate</button>
        </div>
        <div id="validate-result"></div>
      </div>
    </div>

    <p class="section-title" style="margin-top:24px;">Raw document (after)</p>
    <div class="change-nav" id="event-change-nav"><span class="change-label">Changes</span><span class="change-count">0 / 0</span><button type="button" data-direction="previous" title="Previous change">↑</button><button type="button" data-direction="next" title="Next change">↓</button></div>
    <pre class="raw" id="event-raw-document">${renderRawDocument(ev)}</pre>
  `;

  detail.scrollTop = 0;
  setupChangeNavigator('event-change-nav', 'event-raw-document', 'changed');

  const templateBox = detail.querySelector('.template-box');
  if (templateBox) {
    templateBox.previousElementSibling?.remove();
    templateBox.remove();
  }

  const toggle = document.getElementById('template-toggle');
  const controls = document.getElementById('template-controls');
  if (!toggle) return;
  toggle.addEventListener('change', async () => {
    controls.style.display = toggle.checked ? 'block' : 'none';
    if (toggle.checked) await populateTemplateSelect(ev.collection);
  });

  document.getElementById('validate-btn')?.addEventListener('click', async () => {
    const templateId = document.getElementById('template-select').value;
    if (!templateId) return;
    const r = await fetch(`/api/events/${eventId}/validate`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ templateId })
    });
    const result = await r.json();
    const box = document.getElementById('validate-result');
    if (result.valid){
      box.innerHTML = `<div class="validate-result valid">✓ ตรงกับ template</div>`;
    } else {
      box.innerHTML = `<div class="validate-result invalid">✗ ไม่ตรงกับ template (${result.errors.length} ปัญหา)</div>
        <ul class="err-list">${result.errors.map(e => `<li><code>${escapeHtml(e.path)}</code> — ${escapeHtml(e.message || e.type)}${e.expected !== undefined ? `, expected: <code>${escapeHtml(jsonPreview(e.expected))}</code>` : ''}${e.actual !== undefined ? `, actual: <code>${escapeHtml(jsonPreview(e.actual))}</code>` : ''}</li>`).join('')}</ul>`;
    }
  });
}

async function populateTemplateSelect(collection){
  const sel = document.getElementById('template-select');
  if (!state.templatesCache[collection]){
    const res = await fetch(`/api/templates?collection=${encodeURIComponent(collection)}`);
    state.templatesCache[collection] = await res.json();
  }
  const templates = state.templatesCache[collection];
  sel.innerHTML = templates.length
    ? templates.map(t => `<option value="${escapeHtml(t._id)}">${escapeHtml(t.actionName ? `${t.name} (${t.actionName})` : t.name)}</option>`).join('')
    : `<option value="">ยังไม่มี template สำหรับ collection นี้</option>`;
}

function readFilters(){
  state.filters = {
    collection: document.getElementById('filter-collection').value.trim(),
    methodName: document.getElementById('filter-action').value.trim(),
    documentId: document.getElementById('filter-document').value.trim()
  };
}

function setSessionStatus(text){
  document.getElementById('session-status').textContent = text;
}

async function startCapture(){
  readFilters();
  const name = document.getElementById('capture-name').value.trim() || state.filters.methodName || 'manual-action';
  const filters = {};
  if (state.filters.collection) filters.collection = state.filters.collection;
  if (state.filters.documentId) filters.documentId = state.filters.documentId;

  const res = await fetch('/api/action-sessions/start', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, filters })
  });
  state.activeSession = await res.json();
  document.getElementById('start-capture-btn').disabled = true;
  document.getElementById('stop-capture-btn').disabled = false;
  setSessionStatus(`Capturing: ${state.activeSession.name}`);
}

async function stopCapture(){
  if (!state.activeSession?._id) return;
  const ended = await fetch(`/api/action-sessions/${state.activeSession._id}/end`, { method:'POST' });
  state.activeSession = await ended.json();
  document.getElementById('start-capture-btn').disabled = false;
  document.getElementById('stop-capture-btn').disabled = true;
  await showSessionEvents(state.activeSession._id);
}

async function showSessionEvents(sessionId){
  const res = await fetch(`/api/action-sessions/${sessionId}/events`);
  const { session, events } = await res.json();
  setSessionStatus(`Ended: ${session.name} · ${events.length} event${events.length!==1?'s':''}`);
  document.getElementById('detail-col').innerHTML = `
    <div class="session-box">
      <p class="section-title">Action capture summary</p>
      <div class="detail-head"><h2>${escapeHtml(session.name)}</h2></div>
      <div class="detail-time">${fmtTime(session.startedAt)} - ${fmtTime(session.endedAt || new Date())}</div>
      ${events.length ? events.map(e => `
        <div class="session-event">
          <div class="doc-meta" style="margin-top:0">${opBadge(e.operationType)} <span class="method-tag">${escapeHtml(e.methodName)}</span></div>
          <div class="doc-id" style="margin-top:4px">${escapeHtml(e.collection)} / ${escapeHtml(e.documentId)}</div>
          <div class="muted" style="margin-top:4px; font-size:12px">${(e.changedFields || []).map(f => escapeHtml(f.field)).join(', ') || 'no changed fields'}</div>
        </div>
      `).join('') : '<div class="empty">ไม่พบ event ในช่วง capture นี้ ลองใส่ document id/filter ให้น้อยลงหรือเช็ก WATCH_COLLECTIONS</div>'}
    </div>
  `;
  await loadDocuments();
}

// --- live updates over SSE ---
function connectStream(){
  const es = new EventSource('/api/stream');
  const pulse = document.getElementById('pulse');
  const label = document.getElementById('pulse-label');
  es.onopen = () => { pulse.classList.remove('off'); label.textContent = 'watching live'; };
  es.onerror = () => { pulse.classList.add('off'); label.textContent = 'disconnected'; };
  es.onmessage = () => {
    loadDocuments();
    if (state.collection && state.documentId) selectDocument(state.collection, state.documentId);
  };
}

loadDocuments();
connectStream();
const detailPanel = document.getElementById('detail-col');
const backToTopButton = document.getElementById('back-to-top-btn');
detailPanel.addEventListener('scroll', () => {
  backToTopButton.classList.toggle('visible', detailPanel.scrollTop > 240);
});
backToTopButton.addEventListener('click', () => {
  detailPanel.scrollTo({ top:0, behavior:'smooth' });
});
</script>
